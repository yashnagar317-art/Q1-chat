<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q1 Chat</title><link rel="stylesheet" href="style.css"></head><body>
<header><b>Q1 <span>Chat</span></b><div><button id="settingsBtn">⚙ Settings</button></div></header>
<nav><button class="active" data-filter="online">Online</button><button data-filter="unread">Unread</button><button data-filter="recent">Recent</button><button data-filter="friends">♥ Friends</button></nav>
<main><aside><input id="search" placeholder="Search users..."><div class="note">🛡️ Unsafe content and external promotional/contact links are blocked.</div><div id="users"></div></aside>
<section><div class="chathead"><div><strong id="chatName">Select a person</strong><small id="status">Choose a chat</small></div><div><button id="block">Block</button><button id="report">Report</button></div></div><div id="messages" class="messages"><div class="welcome">💬<h2>Welcome to Q1 Chat</h2><p>Select a person to start a conversation.</p></div></div><div class="composer"><textarea id="input" disabled placeholder="Write a message..."></textarea><button id="send" disabled>Send</button></div></section></main>
<dialog id="settings"><h3>Settings <button onclick="settings.close()">×</button></h3><label>Display name<input id="displayName"></label><label>Gender<select id="gender"><option value="boy">Boy</option><option value="girl">Girl</option><option value="other">Prefer not to say</option></select></label><label>Age group<select id="age"><option>13-17</option><option>18+</option></select></label><button id="blocked">Blocked Users</button><button id="save">Save settings</button><p>For safety, never share passwords, addresses or private contact details.</p></dialog>
<dialog id="blockedDialog"><h3>Blocked Users <button onclick="blockedDialog.close()">×</button></h3><div id="blockedList"></div></dialog>
<script src="app.js"></script></body></html>
